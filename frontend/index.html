<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>本地服务管理</title>
  <link rel="icon" href="/assets/app-icon.svg" type="image/svg+xml" />
  <script>
    // Apply saved theme before paint to avoid flash
    (function () {
      try {
        var t = localStorage.getItem("lsm-theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <script>
    // Use the native macOS title bar (traffic lights) instead of the custom one.
    (function () {
      if (/Mac/i.test(navigator.platform)) {
        document.documentElement.classList.add("platform-mac");
      }
    })();
  </script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="main-titlebar" id="main-titlebar">
    <div class="main-titlebar-brand">
      <img class="main-titlebar-icon" src="/assets/app-icon.svg" alt="" />
      <span>本地服务管理</span>
    </div>
    <div class="main-titlebar-actions">
      <button type="button" class="main-titlebar-btn" id="btn-window-minimize" title="最小化" aria-label="最小化">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M5 12h14" />
        </svg>
      </button>
      <button type="button" class="main-titlebar-btn" id="btn-window-maximize" title="最大化" aria-label="最大化">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="5" y="5" width="14" height="14" rx="1" />
        </svg>
      </button>
      <button type="button" class="main-titlebar-btn main-titlebar-close" id="btn-window-close" title="收起" aria-label="收起">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>
  </div>
  <div class="app">
    <header class="header">
      <div class="header-left">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M4 10.5L12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5z"/>
          </svg>
        </div>
        <div>
          <h1>本地服务管理</h1>
          <p class="subtitle">统一管理 127.0.0.1 上的 WebUI 服务</p>
        </div>
      </div>
      <div class="header-actions">
        <div class="theme-toggle" role="group" aria-label="界面主题">
          <button type="button" id="theme-light" data-theme-set="light" title="白天模式">
            <span class="icon" aria-hidden="true">☀</span> 白天
          </button>
          <button type="button" id="theme-dark" data-theme-set="dark" title="夜间模式">
            <span class="icon" aria-hidden="true">☾</span> 夜间
          </button>
        </div>
        <button type="button" class="btn btn-ghost" id="btn-ports" title="扫描本机正在监听的端口">端口探测</button>
        <button type="button" class="btn btn-ghost" id="btn-refresh" title="刷新状态">刷新</button>
        <button type="button" class="btn btn-primary" id="btn-add">添加服务</button>
      </div>
    </header>

    <section class="storage-strip" aria-labelledby="storage-title">
      <div class="storage-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h4l2 2h7A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-9z" />
          <path d="M3.5 10h17" />
        </svg>
      </div>
      <div class="storage-content">
        <div class="storage-heading">
          <h2 id="storage-title">数据目录</h2>
          <span class="storage-status" id="storage-status">独立保存</span>
        </div>
        <code class="storage-path" id="storage-path">正在读取…</code>
        <p>应用移动后配置仍会保留；可按需改到其他可写文件夹。</p>
      </div>
      <div class="storage-actions">
        <button type="button" class="btn btn-ghost btn-sm" id="btn-storage-change">修改目录</button>
        <button type="button" class="btn btn-ghost btn-sm" id="btn-storage-reset" hidden>恢复默认</button>
      </div>
    </section>

    <main>
      <section class="stats" id="stats">
        <div class="stat-card">
          <span class="stat-label">服务总数</span>
          <span class="stat-value" id="stat-total">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">运行中</span>
          <span class="stat-value running" id="stat-running">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">已停止</span>
          <span class="stat-value stopped" id="stat-stopped">0</span>
        </div>
      </section>

      <!-- Local listening ports explorer -->
      <section class="ports-panel" id="ports-panel" aria-labelledby="ports-title">
        <div class="ports-header">
          <div class="ports-title-row">
            <h2 id="ports-title">本地监听端口</h2>
            <button type="button" class="icon-btn ports-refresh" id="btn-ports-refresh" title="重新扫描" aria-label="重新扫描">↻</button>
            <span class="ports-meta" id="ports-meta">点击扫描查看本机占用</span>
          </div>
          <div class="ports-toolbar">
            <div class="ports-proto" role="group" aria-label="协议筛选">
              <button type="button" class="ports-chip active" data-proto="all">全部</button>
              <button type="button" class="ports-chip" data-proto="tcp">TCP</button>
              <button type="button" class="ports-chip" data-proto="udp">UDP</button>
            </div>
            <label class="ports-hide-system">
              <input type="checkbox" id="ports-hide-system" checked />
              隐藏系统进程
            </label>
            <div class="ports-search-wrap">
              <input type="search" id="ports-filter" placeholder="过滤进程 / 端口…" autocomplete="off" />
            </div>
          </div>
        </div>
        <div class="ports-body" id="ports-body">
          <div class="ports-placeholder" id="ports-placeholder">
            <p>不知道本机还有哪些 WebUI 在跑？扫描监听端口，按进程分组显示，一键添加为服务。</p>
            <button type="button" class="btn btn-primary" id="btn-ports-scan">扫描本机端口</button>
          </div>
          <div class="ports-grid" id="ports-grid" hidden></div>
        </div>
      </section>

      <section class="grid" id="service-grid" aria-live="polite"></section>

      <div class="empty" id="empty-state" hidden>
        <div class="empty-icon">⬡</div>
        <h2>还没有服务</h2>
        <p>添加本地服务目录，即可在此统一启停并打开 WebUI。</p>
        <button type="button" class="btn btn-primary" id="btn-add-empty">添加第一个服务</button>
      </div>
    </main>
  </div>

  <!-- Modal: Add / Edit -->
  <div class="modal-overlay" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h2 id="modal-title">添加服务</h2>
        <button type="button" class="icon-btn" id="modal-close" aria-label="关闭">×</button>
      </div>
      <form id="service-form" class="modal-body">
        <input type="hidden" id="f-id" />

        <div class="row-2">
          <label class="field">
            <span>端口 <em>*</em></span>
            <div class="row">
              <input type="number" id="f-port" required min="1" max="65535" placeholder="8080" />
              <button type="button" class="btn btn-primary" id="btn-discover" title="根据端口定位进程与目录">从端口探测</button>
            </div>
            <small class="hint">服务运行中时，可只填端口 → 探测，自动识别目录与启动脚本</small>
          </label>
          <label class="field">
            <span>WebUI 地址</span>
            <input type="url" id="f-webui" placeholder="http://127.0.0.1:8080/" />
          </label>
        </div>

        <label class="field">
          <span>名称</span>
          <input type="text" id="f-name" placeholder="可留空，探测或保存时自动填充" maxlength="120" />
        </label>

        <label class="field">
          <span>备注</span>
          <input type="text" id="f-notes" placeholder="可选说明" />
        </label>

        <label class="field">
          <span>服务目录</span>
          <div class="row">
            <input type="text" id="f-directory" placeholder="探测自动填写，或点「选择文件夹」" readonly />
            <button type="button" class="btn btn-ghost" id="btn-browse" title="打开系统文件夹选择">选择文件夹</button>
            <button type="button" class="btn btn-ghost" id="btn-scan">扫描脚本</button>
          </div>
          <small class="hint">停止服务时将结束占用该端口的进程，无需停止脚本</small>
        </label>

        <div class="row-2">
          <label class="field">
            <span>启动脚本</span>
            <select id="f-start">
              <option value="">— 未选择 —</option>
            </select>
          </label>
          <label class="field">
            <span>停止脚本（可选）</span>
            <select id="f-stop">
              <option value="">— 不使用，按端口结束进程 —</option>
            </select>
          </label>
        </div>

        <div id="scan-result" class="scan-result" hidden></div>

        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" id="btn-refresh-icon" hidden>重新获取图标</button>
          <div class="spacer"></div>
          <button type="button" class="btn btn-ghost" id="btn-cancel">取消</button>
          <button type="submit" class="btn btn-primary" id="btn-save">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Storage location -->
  <div class="modal-overlay" id="storage-modal" hidden>
    <div class="modal storage-modal" role="dialog" aria-modal="true" aria-labelledby="storage-modal-title">
      <div class="modal-header">
        <h2 id="storage-modal-title">修改数据目录</h2>
        <button type="button" class="icon-btn" id="storage-modal-close" aria-label="关闭">×</button>
      </div>
      <form id="storage-form" class="modal-body">
        <label class="field">
          <span>保存路径</span>
          <div class="row">
            <input type="text" id="f-storage-path" required autocomplete="off" />
            <button type="button" class="btn btn-ghost" id="btn-storage-browse">选择文件夹</button>
          </div>
          <small class="hint">修改后会把现有配置和图标缓存合并到新目录；原目录不会被删除。</small>
        </label>
        <div class="storage-default-hint" id="storage-default-hint"></div>
        <div class="modal-footer">
          <div class="spacer"></div>
          <button type="button" class="btn btn-ghost" id="btn-storage-cancel">取消</button>
          <button type="submit" class="btn btn-primary" id="btn-storage-save">保存目录</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast-host" id="toast-host" aria-live="polite"></div>

  <script src="/js/app.js"></script>
</body>
</html>
